<!DOCTYPE html>
<html>
<head>
    <title>🤖 AI Tutor</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* AI Tutor Styles */
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            height: 80vh;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .chat-header h2 {
            color: #06d3f7;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
        }

        .chat-header .status {
            color: #2ecc71;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        .status-dot.online { background: #2ecc71; }
        .status-dot.basic { background: #f39c12; }
        .status-dot.offline { background: #e74c3c; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px 5px;
            margin-bottom: 15px;
            min-height: 200px;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .message .avatar.bot {
            background: rgba(6, 211, 247, 0.2);
            border: 2px solid #06d3f7;
        }

        .message .avatar.user {
            background: rgba(46, 204, 113, 0.2);
            border: 2px solid #2ecc71;
        }

        .message .bubble {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 15px;
            background: rgba(255,255,255,0.08);
            color: white;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message .bubble p {
            margin: 5px 0;
        }

        .message.user .bubble {
            background: rgba(6, 211, 247, 0.2);
            border: 1px solid rgba(6, 211, 247, 0.3);
        }

        .message.bot .bubble {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .message .time {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
            display: block;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input-area input:focus {
            border-color: #06d3f7;
            background: rgba(255,255,255,0.08);
        }

        .chat-input-area input::placeholder {
            color: #666;
        }

        .chat-input-area button {
            padding: 12px 25px;
            border-radius: 25px;
            border: none;
            background: #06d3f7;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 80px;
        }

        .chat-input-area button:hover {
            background: #04b5d9;
            transform: scale(1.05);
        }

        .chat-input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .quick-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 8px 0 12px 0;
        }

        .quick-actions button {
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #aaa;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
        }

        .quick-actions button:hover {
            background: rgba(6, 211, 247, 0.1);
            border-color: #06d3f7;
            color: white;
        }

        .typing-indicator {
            display: none;
            padding: 10px 0;
            color: #666;
            font-style: italic;
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-indicator span {
            animation: typingDot 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingDot {
            0%, 60%, 100% { opacity: 0; }
            30% { opacity: 1; }
        }

        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #06d3f7;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #04b5d9;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: #06d3f7;
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
        }

        .back-btn:hover {
            color: #04b5d9;
        }

        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: #aaa;
        }

        .welcome-message .icon {
            font-size: 64px;
            display: block;
            margin-bottom: 20px;
        }

        .welcome-message h3 {
            color: white;
            margin-bottom: 10px;
        }

        .welcome-message p {
            margin: 5px 0;
        }

        .ai-mode-toggle {
            background: rgba(6,211,247,0.15);
            border: 1px solid #06d3f7;
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .ai-mode-toggle:hover {
            background: rgba(6,211,247,0.25);
            transform: scale(1.05);
        }

        .ai-mode-toggle.basic {
            border-color: #f39c12;
            background: rgba(243,156,18,0.15);
        }

        .ai-mode-toggle.basic:hover {
            background: rgba(243,156,18,0.25);
        }

        .mode-indicator {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 10px;
            display: inline-block;
            margin-left: 8px;
        }

        .mode-indicator.advanced {
            background: rgba(6,211,247,0.2);
            color: #06d3f7;
        }

        .mode-indicator.basic {
            background: rgba(243,156,18,0.2);
            color: #f39c12;
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 90vh;
                padding: 12px;
            }
            .message .bubble {
                max-width: 85%;
                font-size: 14px;
            }
            .quick-actions button {
                font-size: 11px;
                padding: 4px 10px;
            }
            .chat-header h2 {
                font-size: 18px;
            }
        }
    </style>
</head>

<body class="student-bg">

<div class="card" style="width: 95%; max-width: 900px; margin: 20px auto; padding: 15px; background: rgba(0,0,0,0.3);">
    <div class="chat-container">
        <!-- Chat Header -->
        <div class="chat-header">
            <div>
                <h2>🤖 AI Tutor</h2>
                <div class="status">
                    <span class="status-dot" id="aiStatusDot"></span>
                    <span id="aiStatusText">Loading...</span>
                    <span class="mode-indicator advanced" id="modeIndicator">Advanced</span>
                </div>
            </div>
            <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                <button class="ai-mode-toggle" id="aiModeToggle" onclick="toggleAIMode()">
                    🧠 Switch to Basic AI
                </button>
                <button class="back-btn" onclick="window.location.href='learner.html'">← Back</button>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <button onclick="sendQuickMessage('Help me with math homework')">📐 Math Help</button>
            <button onclick="sendQuickMessage('Study tips for exams')">📝 Study Tips</button>
            <button onclick="sendQuickMessage('Tell me a joke')">😂 Joke</button>
            <button onclick="sendQuickMessage('Motivate me')">💪 Motivation</button>
            <button onclick="sendQuickMessage('What time is it?')">🕐 Time</button>
            <button onclick="sendQuickMessage('Help with English essay')">📖 English</button>
            <button onclick="sendQuickMessage('Explain photosynthesis')">🌿 Science</button>
            <button onclick="sendQuickMessage('What is AI?')">🤖 About AI</button>
        </div>

        <!-- Chat Messages -->
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <span class="icon">🤖</span>
                <h3>Welcome to AI Tutor!</h3>
                <p>I'm here to help you with your studies.</p>
                <p style="color: #666; font-size: 14px;">Ask me about homework, subjects, study tips, or just have a chat!</p>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <span>●</span>
            <span>●</span>
            <span>●</span>
            <span style="margin-left: 5px;">AI Tutor is thinking...</span>
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
            <input id="chatInput" type="text" placeholder="Ask me anything..." onkeypress="handleKeyPress(event)">
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
// Get user from localStorage
const user = JSON.parse(localStorage.getItem("loggedInUser"));

// Redirect if not logged in
if (!user) {
    window.location.href = "Login.html";
}

const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const typingIndicator = document.getElementById('typingIndicator');

let useAdvancedAI = true;

// ============================================
// ===== CHECK AI STATUS =====
// ============================================
async function checkAIStatus() {
    try {
        const response = await fetch('/api/chat/status');
        const data = await response.json();
        const statusDot = document.getElementById('aiStatusDot');
        const statusText = document.getElementById('aiStatusText');
        const modeToggle = document.getElementById('aiModeToggle');
        const modeIndicator = document.getElementById('modeIndicator');
        
        if (data.success && data.openai && data.openai.status === 'available') {
            statusDot.className = 'status-dot online';
            statusText.textContent = 'Advanced AI Online';
            useAdvancedAI = true;
            modeToggle.textContent = '🧠 Switch to Basic AI';
            modeToggle.className = 'ai-mode-toggle';
            modeIndicator.textContent = 'Advanced';
            modeIndicator.className = 'mode-indicator advanced';
        } else {
            statusDot.className = 'status-dot basic';
            statusText.textContent = 'Basic AI Mode';
            useAdvancedAI = false;
            modeToggle.textContent = '🤖 Switch to Advanced AI';
            modeToggle.className = 'ai-mode-toggle basic';
            modeIndicator.textContent = 'Basic';
            modeIndicator.className = 'mode-indicator basic';
        }
    } catch (error) {
        console.error('Status check error:', error);
        document.getElementById('aiStatusDot').className = 'status-dot offline';
        document.getElementById('aiStatusText').textContent = 'Offline';
    }
}

// ============================================
// ===== TOGGLE AI MODE =====
// ============================================
function toggleAIMode() {
    useAdvancedAI = !useAdvancedAI;
    const toggle = document.getElementById('aiModeToggle');
    const modeIndicator = document.getElementById('modeIndicator');
    
    if (useAdvancedAI) {
        toggle.textContent = '🧠 Switch to Basic AI';
        toggle.className = 'ai-mode-toggle';
        modeIndicator.textContent = 'Advanced';
        modeIndicator.className = 'mode-indicator advanced';
        addMessage('🔄 Switched to **Advanced AI** mode. I can now answer more complex questions using OpenAI!', 'bot');
    } else {
        toggle.textContent = '🤖 Switch to Advanced AI';
        toggle.className = 'ai-mode-toggle basic';
        modeIndicator.textContent = 'Basic';
        modeIndicator.className = 'mode-indicator basic';
        addMessage('🔄 Switched to **Basic AI** mode. I\'ll use simpler responses.', 'bot');
    }
}

// ============================================
// ===== SEND MESSAGE =====
// ============================================
async function sendMessage() {
    const message = chatInput.value.trim();
    if (!message) return;

    chatInput.value = '';
    sendBtn.disabled = true;
    addMessage(message, 'user');
    typingIndicator.classList.add('active');

    try {
        let endpoint = useAdvancedAI ? '/api/chat/advanced' : '/api/chat';
        const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                message: message,
                studentEmail: user.email 
            })
        });

        const data = await response.json();
        typingIndicator.classList.remove('active');

        if (data.success) {
            addMessage(data.response, 'bot');
        } else {
            addMessage('Sorry, I encountered an error. Please try again.', 'bot');
        }
    } catch (error) {
        console.error('Chat error:', error);
        typingIndicator.classList.remove('active');
        addMessage('Sorry, I\'m having trouble connecting. Please try again.', 'bot');
    }

    sendBtn.disabled = false;
    chatInput.focus();
}

// ============================================
// ===== ADD MESSAGE =====
// ============================================
function addMessage(text, sender) {
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${sender}`;
    
    const avatar = document.createElement('div');
    avatar.className = `avatar ${sender}`;
    avatar.textContent = sender === 'bot' ? '🤖' : '👤';
    
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    
    // Handle markdown-style bold
    const formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    
    // Handle line breaks
    const paragraphs = formattedText.split('\n');
    paragraphs.forEach((p, i) => {
        if (p.trim()) {
            const pElement = document.createElement('p');
            pElement.innerHTML = p;
            bubble.appendChild(pElement);
        } else if (i < paragraphs.length - 1) {
            const br = document.createElement('br');
            bubble.appendChild(br);
        }
    });
    
    // Add timestamp
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = new Date().toLocaleTimeString();
    bubble.appendChild(time);
    
    messageDiv.appendChild(avatar);
    messageDiv.appendChild(bubble);
    
    chatMessages.appendChild(messageDiv);
    
    // Remove welcome message if present
    const welcome = chatMessages.querySelector('.welcome-message');
    if (welcome) {
        welcome.remove();
    }
    
    // Scroll to bottom
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

// ============================================
// ===== QUICK MESSAGE =====
// ============================================
function sendQuickMessage(message) {
    chatInput.value = message;
    sendMessage();
}

// ============================================
// ===== HANDLE ENTER KEY =====
// ============================================
function handleKeyPress(event) {
    if (event.key === 'Enter') {
        sendMessage();
    }
}

// ============================================
// ===== PAGE LOAD =====
// ============================================
document.addEventListener('DOMContentLoaded', function() {
    chatInput.focus();
    checkAIStatus();
    
    // Add greeting after status check
    setTimeout(() => {
        const hasMessages = chatMessages.querySelectorAll('.message').length > 0;
        if (!hasMessages) {
            const greeting = `Hello ${user.full_name || 'Student'}! 👋 I'm your AI Tutor. 
            
I can help you with:
• 📚 Homework and assignments
• 📝 Study tips and exam preparation  
• 📊 Understanding different subjects
• 💪 Motivation and encouragement
• 😂 Jokes and fun facts

What would you like to learn about today?`;
            addMessage(greeting, 'bot');
        }
    }, 1500);
});
</script>

</body>
</html>
