<!DOCTYPE html>
<html>
<head>
    <title>Attendance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="student-bg">

<div class="card">
      <ul id="list"></ul>

    <h2>📋 Attendance Records</h2>

    <div id="attendance-container"></div>

    <button onclick="window.location.href='learner.html'">Back </button>

</div>




<script>
const container = document.getElementById("attendance-container");

fetch('/attendance')
    .then(res => res.json())
    .then(data => {
        if (data.length === 0) {
            container.innerHTML = `
                <div class="attendance-item">No attendance records yet.</div>
            `;
            return;
        }

    data.forEach(item => {

        const div = document.createElement("div");
        div.classList.add("attendance-item");

        div.innerHTML = `
            <div class="date">${item.date_recorded}</div>
            <div class="status ${item.status.toLowerCase()}">
                ${item.status}
            </div>
        `;

        container.appendChild(div);
    });

});
</script>

</body>
</html>
