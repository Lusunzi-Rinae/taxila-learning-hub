<!DOCTYPE html>
<html>
<head>
    <title>Manage Content</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
    <style>
        .filter-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-container input, .filter-container select {
            padding: 10px 15px;
            border-radius: 20px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 14px;
        }
        .filter-container input::placeholder {
            color: #666;
        }
        .filter-container select option {
            background: #1a1a2e;
            color: white;
        }
        .filter-container .refresh-btn {
            background: #2ecc71;
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .filter-container .refresh-btn:hover {
            background: #27ae60;
        }

        .content-card {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-left: 4px solid #888;
            transition: all 0.3s ease;
        }
        .content-card:hover {
            background: rgba(255,255,255,0.1);
            transform: translateX(5px);
        }
        .content-card .content-info {
            flex: 1;
            min-width: 200px;
        }
        .content-card .content-info .title {
            color: white;
            font-weight: bold;
            font-size: 16px;
        }
        .content-card .content-info .type-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 8px;
        }
        .type-badge.homework { background: #3498db; color: white; }
        .type-badge.announcement { background: #9b59b6; color: white; }
        .type-badge.study { background: #2ecc71; color: white; }

        .content-card .content-info .details {
            color: #aaa;
            font-size: 13px;
            margin-top: 3px;
        }
        .content-card .content-info .details span {
            margin-right: 10px;
        }

        .content-card .delete-btn {
            background: #e74c3c;
            padding: 6px 16px;
            border-radius: 20px;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .content-card .delete-btn:hover {
            background: #c0392b;
            transform: scale(1.05);
        }

        .no-content {
            text-align: center;
            padding: 40px;
            color: #aaa;
        }
        .no-content .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 15px;
        }

        #contentList {
            max-height: 450px;
            overflow-y: auto;
            padding-right: 5px;
        }
        #contentList::-webkit-scrollbar {
            width: 6px;
        }
        #contentList::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        #contentList::-webkit-scrollbar-thumb {
            background: #06d3f7;
            border-radius: 10px;
        }
        #contentList::-webkit-scrollbar-thumb:hover {
            background: #04b5d9;
        }

        .back-btn {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
        }

        .content-card.homework { border-left-color: #3498db; }
        .content-card.announcement { border-left-color: #9b59b6; }
        .content-card.study { border-left-color: #2ecc71; }

        .count-info {
            color: #888;
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body class="admin-bg">

<h1 class="main-title">📋 Manage Content</h1>

<div class="card">
    <h2>All Uploaded Content</h2>

    <!-- Filters -->
    <div class="filter-container">
        <input type="text" id="searchInput" placeholder="🔍 Search by title..." onkeyup="filterContent()">
        <select id="typeFilter" onchange="filterContent()">
            <option value="all">All Types</option>
            <option value="homework">📚 Homework</option>
            <option value="announcement">📢 Announcements</option>
            <option value="study">📂 Study Materials</option>
        </select>
        <select id="gradeFilter" onchange="filterContent()">
            <option value="all">All Grades</option>
            <option value="Grade 8">Grade 8</option>
            <option value="Grade 9">Grade 9</option>
            <option value="Grade 10">Grade 10</option>
            <option value="Grade 11">Grade 11</option>
            <option value="Grade 12">Grade 12</option>
        </select>
        <button class="refresh-btn" onclick="loadContent()">🔄 Refresh</button>
    </div>

    <!-- Count -->
    <div class="count-info" id="countInfo">Loading...</div>

    <!-- Content List -->
    <div id="contentList"></div>

    <button onclick="window.location.href='admin.html'" class="back-btn">← Back to Dashboard</button>
</div>

<script>
const admin = JSON.parse(localStorage.getItem("loggedInUser"));

if (!admin || admin.role !== "admin") {
    window.location.href = "Login.html";
}

let allContent = [];

// ============================================
// ===== LOAD CONTENT =====
// ============================================
async function loadContent() {
    const container = document.getElementById('contentList');
    container.innerHTML = '<p style="color: #aaa; text-align: center;">📊 Loading content...</p>';

    try {
        // Fetch all content in parallel
        const [homeworkRes, announcementsRes, studyRes] = await Promise.all([
            fetch('/homework'),
            fetch('/announcements'),
            fetch('/study-materials')
        ]);

        const homework = await homeworkRes.json();
        const announcements = await announcementsRes.json();
        const study = await studyRes.json();

        // Format each type with a type label
        const formattedHomework = homework.map(item => ({
            ...item,
            type: 'homework',
            typeLabel: '📚 Homework',
            title: item.title || 'Untitled',
            description: item.description || '',
            grade: item.grade_level || 'All Grades',
            subject: item.subject || 'General',
            uploaded_by: item.uploaded_by || 'Unknown',
            date: item.created_at || new Date().toISOString(),
            id: item.homework_id
        }));

        const formattedAnnouncements = announcements.map(item => ({
            ...item,
            type: 'announcement',
            typeLabel: '📢 Announcement',
            title: item.title || 'Untitled',
            description: item.message || '',
            grade: item.grade_level || 'All Grades',
            subject: item.subject || 'General',
            uploaded_by: item.posted_by || 'Unknown',
            date: item.created_at || new Date().toISOString(),
            id: item.announcement_id
        }));

        const formattedStudy = study.map(item => ({
            ...item,
            type: 'study',
            typeLabel: '📂 Study Material',
            title: item.title || 'Untitled',
            description: item.description || '',
            grade: item.grade_level || 'All Grades',
            subject: item.subject || 'General',
            uploaded_by: item.uploaded_by || 'Unknown',
            date: item.created_at || new Date().toISOString(),
            id: item.material_id
        }));

        // Combine all content
        allContent = [...formattedHomework, ...formattedAnnouncements, ...formattedStudy];

        // Sort by date (most recent first)
        allContent.sort((a, b) => new Date(b.date) - new Date(a.date));

        renderContent(allContent);

    } catch (error) {
        console.error("Error loading content:", error);
        container.innerHTML = '<p style="color: #e74c3c; text-align: center;">❌ Error loading content</p>';
    }
}

// ============================================
// ===== RENDER CONTENT =====
// ============================================
function renderContent(items) {
    const container = document.getElementById('contentList');
    const countInfo = document.getElementById('countInfo');

    if (!items || items.length === 0) {
        container.innerHTML = `
            <div class="no-content">
                <span class="icon">📭</span>
                <p>No content found</p>
                <p style="color: #666; font-size: 13px;">Teachers haven't uploaded anything yet.</p>
            </div>
        `;
        countInfo.textContent = 'Showing 0 items';
        return;
    }

    countInfo.textContent = `Showing ${items.length} items (most recent first)`;

    let html = '';
    items.forEach(item => {
        const typeClass = item.type;
        const date = new Date(item.date).toLocaleDateString('en-GB');

        html += `
            <div class="content-card ${typeClass}">
                <div class="content-info">
                    <div class="title">
                        <span class="type-badge ${typeClass}">${item.typeLabel}</span>
                        ${item.title}
                    </div>
                    <div class="details">
                        <span>📚 ${item.grade}</span>
                        <span>📖 ${item.subject}</span>
                        <span>👤 ${item.uploaded_by}</span>
                        <span>📅 ${date}</span>
                    </div>
                    ${item.description ? `<div style="color: #888; font-size: 13px; margin-top: 3px;">${item.description.substring(0, 100)}${item.description.length > 100 ? '...' : ''}</div>` : ''}
                </div>
                <button class="delete-btn" onclick="deleteContent('${item.type}', '${item.id}')">🗑️ Delete</button>
            </div>
        `;
    });

    container.innerHTML = html;
}

// ============================================
// ===== FILTER CONTENT =====
// ============================================
function filterContent() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const type = document.getElementById('typeFilter').value;
    const grade = document.getElementById('gradeFilter').value;

    let filtered = allContent;

    if (type !== 'all') {
        filtered = filtered.filter(item => item.type === type);
    }

    if (grade !== 'all') {
        filtered = filtered.filter(item => item.grade === grade);
    }

    if (search) {
        filtered = filtered.filter(item =>
            item.title.toLowerCase().includes(search) ||
            item.description.toLowerCase().includes(search)
        );
    }

    renderContent(filtered);
}

// ============================================
// ===== DELETE CONTENT =====
// ============================================
function deleteContent(type, id) {
    const typeLabels = {
        'homework': 'homework',
        'announcement': 'announcement',
        'study': 'study material'
    };

    if (!confirm(`Are you sure you want to delete this ${typeLabels[type]}?`)) return;

    let url = '';
    if (type === 'homework') url = '/delete-homework/' + id;
    else if (type === 'announcement') url = '/delete-announcement/' + id;
    else if (type === 'study') url = '/delete-study-material/' + id;

    fetch(url, { method: 'DELETE' })
        .then(res => res.json())
        .then(data => {
            alert(data.message);
            if (data.success) loadContent();
        });
}

// ============================================
// ===== PAGE LOAD =====
// ============================================
document.addEventListener('DOMContentLoaded', function() {
    loadContent();
});
</script>

</body>
</html>
