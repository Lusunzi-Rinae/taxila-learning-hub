<!DOCTYPE html>
<html>
<head>
    <title>Announcements</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
</head>

<body class="student-bg">

<h1 class="main-title">Announcements</h1>

<div class="card">
    <div id="filterInfo" style="color: #888; text-align: center; margin-bottom: 15px; font-size: 14px;"></div>
    <ul id="list"></ul>
    <button onclick="window.location.href='learner.html'">Back</button>
</div>

<script>
const list = document.getElementById("list");
const user = JSON.parse(localStorage.getItem("loggedInUser"));
const grade = user.grade_level || '';
const stream = user.stream || '';

// Get user's subjects from marks or use default
// For now, we'll show all subjects for the grade/stream
// Teachers can filter by subject when uploading

fetch("/announcements?grade=" + encodeURIComponent(grade) + "&stream=" + encodeURIComponent(stream))
    .then(res => res.json())
    .then(data => {
        if (data.length === 0) {
            list.innerHTML = "<li>No announcements yet.</li>";
            return;
        }

        document.getElementById("filterInfo").innerHTML = `📚 Showing announcements for <strong>${grade}</strong> ${stream ? '• <strong>' + stream + '</strong>' : ''}`;

        data.forEach(item => {
            const li = document.createElement("li");
            li.innerHTML = `
                <b>${item.title}</b><br>
                ${item.message}<br><br>
                <small style="color: #888;">
                    📚 ${item.grade_level || 'All Grades'} 
                    ${item.stream ? '• ' + item.stream : ''}
                    ${item.subject && item.subject !== 'All Subjects' ? '• 📋 ' + item.subject : ''}
                </small>
            `;
            list.appendChild(li);
        });
    });
</script>

</body>
</html>
