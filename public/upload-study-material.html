<!DOCTYPE html>
<html>

<head>
    <title>Upload Study Material</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
    <style>
        select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 20px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
        }

        select option {
            background: #1a1a2e;
            color: white;
        }

        label {
            color: #aaa;
            display: block;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>

<body class="teacher-bg">

    <h1 class="main-title">Upload Study Material</h1>

    <div class="card">
        <h2>Add Learning Resource</h2>

        <input id="title" placeholder="Material Title">
        <textarea id="description" placeholder="Description" rows="3"></textarea>

        <div id="classInfo"
            style="background: rgba(6, 211, 247, 0.1); padding: 12px 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #06d3f7;">
            📚 <span id="displaySubject" style="color: #06d3f7; font-weight: bold;">Mathematics</span>
            <span id="displayGrade" style="color: white; font-weight: bold;">Grade 10</span>
        </div>

        <input id="fileInput" type="file">

        <button onclick="uploadMaterial()" style="background: #2ecc71; width: 100%;">Upload Material</button>
        <button onclick="goBackToDashboard()">← Back to Dashboard</button>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem("loggedInUser"));



        if (!user || user.role !== "teacher") {
            window.location.href = "Login.html";
        }

        // Get the selected class from localStorage
        const teacherClass = JSON.parse(localStorage.getItem('teacherClass'));

        if (!teacherClass) {
            alert("Please select a class from the dashboard first.");
            window.location.href = "teacher.html";
        }

        // Display the class info
        document.getElementById('displaySubject').textContent = teacherClass.subject;
        document.getElementById('displayGrade').textContent = teacherClass.grade;

        async function uploadMaterial() {
            const title = document.getElementById("title").value.trim();
            const description = document.getElementById("description").value.trim();
            const file = document.getElementById("fileInput").files[0];

            if (!title || !file) {
                alert("Please fill all fields and select a file");
                return;
            }

            const grade_level = teacherClass.grade;
            const subject = teacherClass.subject;
            const stream = '';

            const formData = new FormData();
            formData.append("title", title);
            formData.append("description", description);
            formData.append("grade_level", grade_level);
            formData.append("subject", subject);
            formData.append("stream", stream);
            formData.append("material_type", "file");
            formData.append("uploaded_by", user.full_name);
            formData.append("file", file);

            // ---- Find the button and lock it immediately ----
            const uploadBtn = document.querySelector('button[type="submit"]')
                || document.getElementById('uploadBtn')
                || event.target;
            const originalText = uploadBtn.textContent;
            uploadBtn.disabled = true;
            uploadBtn.textContent = '⏳ Uploading... please wait';
            uploadBtn.style.opacity = '0.7';
            uploadBtn.style.cursor = 'not-allowed';

            // ---- Create (or reuse) an inline status box ----
            let statusBox = document.getElementById('uploadStatus');
            if (!statusBox) {
                statusBox = document.createElement('div');
                statusBox.id = 'uploadStatus';
                statusBox.style.cssText =
                    'padding:12px 16px; border-radius:10px; margin-bottom:14px; ' +
                    'font-size:14px; font-weight:bold; border:1px solid;';
                const form = document.querySelector('form');
                if (form) form.prepend(statusBox);
            }
            statusBox.style.display = 'block';
            statusBox.style.background = 'rgba(6,211,247,0.15)';
            statusBox.style.borderColor = '#06d3f7';
            statusBox.style.color = '#06d3f7';
            statusBox.textContent = '⏳ Uploading and indexing — this may take a few seconds for larger files…';

            try {
                const response = await fetch("/upload-study-material", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    statusBox.style.background = 'rgba(46,204,113,0.15)';
                    statusBox.style.borderColor = '#2ecc71';
                    statusBox.style.color = '#2ecc71';
                    statusBox.textContent = '✅ ' + (data.message || 'Material uploaded successfully');

                    document.getElementById("title").value = "";
                    document.getElementById("description").value = "";
                    document.getElementById("fileInput").value = "";
                } else {
                    statusBox.style.background = 'rgba(231,76,60,0.15)';
                    statusBox.style.borderColor = '#e74c3c';
                    statusBox.style.color = '#e74c3c';
                    statusBox.textContent = '❌ ' + (data.message || 'Upload failed');
                }
            } catch (error) {
                console.error("Upload error:", error);
                statusBox.style.background = 'rgba(231,76,60,0.15)';
                statusBox.style.borderColor = '#e74c3c';
                statusBox.style.color = '#e74c3c';
                statusBox.textContent = '❌ Failed to upload: ' + error.message;
            } finally {
                // Always re-enable the button, whether upload succeeded or failed
                uploadBtn.disabled = false;
                uploadBtn.textContent = originalText;
                uploadBtn.style.opacity = '1';
                uploadBtn.style.cursor = 'pointer';
            }
        }
        // ============================================
        // ===== GO BACK TO DASHBOARD =====
        // ============================================
        function goBackToDashboard() {
            localStorage.setItem('returningFromPage', 'true');
            window.location.href = 'teacher.html';
        }
    </script>

</body>

</html>
