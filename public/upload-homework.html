<!DOCTYPE html>
<html>

<head>
    <title>Upload Homework</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
    <style>
        select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 20px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
        }

        select option {
            background: #1a1a2e;
            color: white;
        }

        label {
            color: #aaa;
            display: block;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>

<body class="teacher-bg">

    <h1 class="main-title">Upload Homework</h1>

    <div class="card">
        <h2>Add Homework Assignment</h2>

        <input id="hwTitle" placeholder="Homework Title">
        <textarea id="hwDesc" placeholder="Homework Description"></textarea>

        <div id="classInfo"
            style="background: rgba(6, 211, 247, 0.1); padding: 12px 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #06d3f7;">
            📚 <span id="displaySubject" style="color: #06d3f7; font-weight: bold;">Mathematics</span>
            <span id="displayGrade" style="color: white; font-weight: bold;">Grade 10</span>
        </div>


        <input id="hwFile" type="file">

        <button onclick="addHomework()" style="background: #2ecc71; width: 100%;">Upload Homework</button>
        <button onclick="goBackToDashboard()" style="margin-top: 20px; width: 100%; padding: 12px;">← Back to
            Dashboard</button>
    </div>

    <script>

        const user = JSON.parse(localStorage.getItem("loggedInUser"));

        if (!user || user.role !== "teacher") {
            window.location.href = "Login.html";
        }

        // Get the selected class from localStorage
        const teacherClass = JSON.parse(localStorage.getItem('teacherClass'));

        if (!teacherClass) {
            alert("Please select a class from the dashboard first.");
            window.location.href = "teacher.html";
        }

        // Display the class info
        document.getElementById('displaySubject').textContent = teacherClass.subject;
        document.getElementById('displayGrade').textContent = teacherClass.grade;

        async function addHomework() {
            const title = document.getElementById("hwTitle").value;
            const description = document.getElementById("hwDesc").value;
            const file = document.getElementById("hwFile").files[0];

            if (!title || !description || !file) {
                alert("Please fill all fields and choose a file");
                return;
            }

            // Get grade and subject from the selected class
            const grade_level = teacherClass.grade;
            const subject = teacherClass.subject;
            const stream = '';

            const uploaded_by = user ? user.full_name : '';

            const formData = new FormData();
            formData.append("title", title);
            formData.append("description", description);
            formData.append("grade_level", grade_level);
            formData.append("stream", stream);
            formData.append("subject", subject);
            formData.append("uploaded_by", uploaded_by);
            formData.append("file", file);

            try {
                const response = await fetch("/upload-homework", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                alert(data.message);

                if (data.success) {
                    document.getElementById("hwTitle").value = "";
                    document.getElementById("hwDesc").value = "";
                    document.getElementById("hwFile").value = "";
                }
            } catch (error) {
                alert("Server error. Please try again.");
            }
        }

        // ============================================
        // ===== GO BACK TO DASHBOARD =====
        // ============================================
        function goBackToDashboard() {
            localStorage.setItem('returningFromPage', 'true');
            window.location.href = 'teacher.html';
        }


    </script>

</body>

</html>
