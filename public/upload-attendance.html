<!DOCTYPE html>
<html>
<head>
    <title>Upload Attendance</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="teacher-bg">

<h1 class="main-title">📅 Upload Attendance</h1>

<div class="card">
    <h2>Record Student Attendance</h2>
    
    <div id="messageBox" style="display: none; padding: 10px; border-radius: 8px; margin-bottom: 15px;"></div>

    <input id="student_email" type="email" placeholder="Student Email" required>
    <input id="date_recorded" type="date" required>

    <select id="status">
        <option value="Present">✅ Present</option>
        <option value="Absent">❌ Absent</option>
        <option value="Late">⏰ Late</option>
    </select>

    <!-- Grade Selection -->
    <select id="attendanceGrade" style="width:100%; padding:12px; margin:10px 0; border-radius:20px; border:none;">
        <option value="All Grades">📚 All Grades</option>
        <option value="Grade 8">Grade 8</option>
        <option value="Grade 9">Grade 9</option>
        <option value="Grade 10">Grade 10</option>
        <option value="Grade 11">Grade 11</option>
        <option value="Grade 12">Grade 12</option>
    </select>

    <button onclick="addAttendance()" style="background: #2ecc71; width: 100%;">✅ Save Attendance</button>
    
    <hr style="border-color: rgba(255,255,255,0.1); margin: 20px 0;">
    
    <h3>📋 Recently Added</h3>
    <div id="recentAttendance" style="text-align: left; max-height: 300px; overflow-y: auto;">
        <p style="color: #aaa; text-align: center;">No attendance records added yet.</p>
    </div>

    <button onclick="window.location.href='teacher.html'" style="margin-top: 10px;">← Back to Dashboard</button>
</div>

<script>
let recentAttendance = [];

async function addAttendance() {
    const student_email = document.getElementById("student_email").value.trim();
    const date_recorded = document.getElementById("date_recorded").value;
    const status = document.getElementById("status").value;
    const grade_level = document.getElementById("attendanceGrade").value;

    if (!student_email) {
        showMessage("❌ Please enter a student email", "error");
        return;
    }

    if (!isValidEmail(student_email)) {
        showMessage("❌ Please enter a valid email address", "error");
        return;
    }

    if (!date_recorded) {
        showMessage("❌ Please select a date", "error");
        return;
    }

    try {
        showMessage("⏳ Saving attendance...", "info");
        
        const response = await fetch("/add-attendance", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ student_email, date_recorded, status, grade_level })
        });

        const data = await response.json();
        
        if (data.success) {
            showMessage("✅ Attendance saved successfully!", "success");
            
            const dateObj = new Date(date_recorded);
            const formattedDate = dateObj.toLocaleDateString('en-GB');
            recentAttendance.unshift({
                student_email,
                date: formattedDate,
                status,
                grade_level,
                time: new Date().toLocaleString()
            });
            
            updateRecentAttendance();
            
            document.getElementById("student_email").value = "";
            document.getElementById("date_recorded").value = "";
            document.getElementById("status").value = "Present";
            document.getElementById("attendanceGrade").value = "All Grades";
        } else {
            showMessage("❌ " + data.message, "error");
        }
    } catch (error) {
        console.error("Error:", error);
        showMessage("❌ Server error. Please try again.", "error");
    }
}

function showMessage(message, type) {
    const box = document.getElementById("messageBox");
    box.style.display = "block";
    box.textContent = message;
    
    if (type === "success") {
        box.style.background = "rgba(46, 204, 113, 0.2)";
        box.style.border = "1px solid #2ecc71";
        box.style.color = "#2ecc71";
    } else if (type === "error") {
        box.style.background = "rgba(231, 76, 60, 0.2)";
        box.style.border = "1px solid #e74c3c";
        box.style.color = "#e74c3c";
    } else {
        box.style.background = "rgba(52, 152, 219, 0.2)";
        box.style.border = "1px solid #3498db";
        box.style.color = "#3498db";
    }
    
    setTimeout(() => {
        box.style.display = "none";
    }, 5000);
}

function isValidEmail(email) {
    const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return pattern.test(email);
}

function updateRecentAttendance() {
    const container = document.getElementById("recentAttendance");
    
    if (recentAttendance.length === 0) {
        container.innerHTML = '<p style="color: #aaa; text-align: center;">No attendance records added yet.</p>';
        return;
    }
    
    let html = '';
    recentAttendance.slice(0, 10).forEach((record, index) => {
        const statusColor = record.status === 'Present' ? '#2ecc71' : 
                           record.status === 'Late' ? '#f39c12' : '#e74c3c';
        html += `
            <div style="background: rgba(255,255,255,0.05); padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid ${statusColor};">
                <div>
                    <strong style="color: white;">${record.student_email}</strong>
                    <br>
                    <small style="color: #888;">📅 ${record.date} • ${record.grade_level || 'All Grades'} • ${record.time}</small>
                </div>
                <div style="color: ${statusColor}; font-weight: bold;">
                    ${record.status}
                </div>
            </div>
        `;
    });
    
    container.innerHTML = html;
}

document.addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        const activeElement = document.activeElement;
        if (activeElement.id === "student_email" || 
            activeElement.id === "date_recorded") {
            addAttendance();
        }
    }
});
</script>

</body>
</html>
