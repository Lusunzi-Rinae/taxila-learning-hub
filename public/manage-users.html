<!DOCTYPE html>
<html>
<head>
    <title>Manage Users</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
    <style>
        .filter-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-container input, .filter-container select {
            padding: 10px 15px;
            border-radius: 20px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 14px;
        }
        .filter-container input::placeholder {
            color: #666;
        }
        .filter-container select option {
            background: #1a1a2e;
            color: white;
        }

        .user-card {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-left: 4px solid #888;
            transition: all 0.3s ease;
        }
        .user-card:hover {
            background: rgba(255,255,255,0.1);
            transform: translateX(5px);
        }
        .user-card .user-info {
            flex: 1;
            min-width: 200px;
        }
        .user-card .user-info .name {
            color: white;
            font-weight: bold;
            font-size: 16px;
        }
        .user-card .user-info .email {
            color: #888;
            font-size: 14px;
        }
        .user-card .user-info .details {
            color: #aaa;
            font-size: 13px;
            margin-top: 3px;
        }

        .role-badge {
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-right: 8px;
        }
        .role-badge.Learner { background: #2ecc71; color: white; }
        .role-badge.teacher { background: #3498db; color: white; }
        .role-badge.admin { background: #e74c3c; color: white; }
        .role-badge.parent { background: #f39c12; color: white; }

        .user-actions {
            display: flex;
            gap: 8px;
        }
        .user-actions button {
            padding: 6px 16px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .user-actions .delete-btn {
            background: #e74c3c;
            color: white;
        }
        .user-actions .delete-btn:hover {
            background: #c0392b;
            transform: scale(1.05);
        }

        .no-users {
            text-align: center;
            padding: 40px;
            color: #aaa;
        }
        .no-users .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 15px;
        }

        #userList {
            max-height: 450px;
            overflow-y: auto;
            padding-right: 5px;
        }
        #userList::-webkit-scrollbar {
            width: 6px;
        }
        #userList::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        #userList::-webkit-scrollbar-thumb {
            background: #06d3f7;
            border-radius: 10px;
        }
        #userList::-webkit-scrollbar-thumb:hover {
            background: #04b5d9;
        }

        .back-btn {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
        }

        .user-card.Learner { border-left-color: #2ecc71; }
        .user-card.teacher { border-left-color: #3498db; }
        .user-card.admin { border-left-color: #e74c3c; }
        .user-card.parent { border-left-color: #f39c12; }

        .refresh-btn {
            background: #2ecc71;
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .refresh-btn:hover {
            background: #27ae60;
        }
    </style>
</head>

<body class="admin-bg">

<h1 class="main-title">👥 Manage Users</h1>

<div class="card">
    <h2>All Users</h2>

    <!-- Filters -->
    <div class="filter-container">
        <input type="text" id="searchInput" placeholder="🔍 Search by name or email..." onkeyup="filterUsers()">
        <select id="roleFilter" onchange="filterUsers()">
            <option value="all">All Roles</option>
            <option value="Learner">🟢 Learner</option>
            <option value="teacher">🔵 Teacher</option>
            <option value="admin">🔴 Admin</option>
            <option value="parent">🟡 Parent</option>
        </select>
       <select id="gradeFilter" onchange="filterUsers()" style="display: none;">
         <option value="all">All Grades</option>
         <option value="Grade 8">Grade 8</option>
         <option value="Grade 9">Grade 9</option>
         <option value="Grade 10">Grade 10</option>
         <option value="Grade 11">Grade 11</option>
         <option value="Grade 12">Grade 12</option>
       </select>
        <button class="refresh-btn" onclick="loadUsers()">🔄 Refresh</button>
    </div>

    <!-- User List -->
    <div id="userList"></div>

    <button onclick="window.location.href='admin.html'" class="back-btn">← Back to Dashboard</button>
</div>

<script>
const admin = JSON.parse(localStorage.getItem("loggedInUser"));

if (!admin || admin.role !== "admin") {
    window.location.href = "Login.html";
}

let allUsers = [];

// ============================================
// ===== LOAD USERS =====
// ============================================
async function loadUsers() {
    const container = document.getElementById('userList');
    container.innerHTML = '<p style="color: #aaa; text-align: center;">📊 Loading users...</p>';

    try {
        const response = await fetch('/users');
        const data = await response.json();

        if (!data || data.length === 0) {
            container.innerHTML = `
                <div class="no-users">
                    <span class="icon">👥</span>
                    <p>No users found</p>
                </div>
            `;
            return;
        }

        allUsers = data;
        renderUsers(allUsers);
        filterUsers();

    } catch (error) {
        console.error("Error loading users:", error);
        container.innerHTML = '<p style="color: #e74c3c; text-align: center;">❌ Error loading users</p>';
    }
}

// ============================================
// ===== RENDER USERS =====
// ============================================
function renderUsers(users) {
    const container = document.getElementById('userList');

    if (!users || users.length === 0) {
        container.innerHTML = `
            <div class="no-users">
                <span class="icon">👥</span>
                <p>No users match your filters</p>
            </div>
        `;
        return;
    }

    let html = '';
    users.forEach(user => {
        const roleClass = user.role || 'learner';
        const roleIcon = user.role === 'Learner' ? '🟢' :
                         user.role === 'teacher' ? '🔵' :
                         user.role === 'admin' ? '🔴' : '🟡';

        let details = '';
        if (user.role === 'Learner') {
            details = `📚 ${user.grade_level || 'No grade'} ${user.stream ? '• ' + user.stream : ''}`;
        } else if (user.role === 'teacher') {
            details = `👨‍🏫 Teacher`;
        } else if (user.role === 'admin') {
            details = `🔑 Administrator`;
        } else if (user.role === 'parent') {
            details = `👨‍👩‍👦 Parent`;
        }

        html += `
            <div class="user-card ${roleClass}">
                <div class="user-info">
                    <div class="name">
                        <span class="role-badge ${roleClass}">${roleIcon} ${user.role}</span>
                        ${user.full_name}
                    </div>
                    <div class="email">📧 ${user.email}</div>
                    <div class="details">${details}</div>
                </div>
                <div class="user-actions">
                    <button class="delete-btn" onclick="deleteUser('${user.id}', '${user.role}')">🗑️ Delete</button>
                </div>
            </div>
        `;
    });

    container.innerHTML = html;
}

// ============================================
// ===== FILTER USERS =====
// ============================================
function filterUsers() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const role = document.getElementById('roleFilter').value;
    const grade = document.getElementById('gradeFilter').value;

    // Show/hide grade filter based on role
    const gradeFilter = document.getElementById('gradeFilter');
    if (role === 'Learner') {
        gradeFilter.style.display = 'block';
    } else {
        gradeFilter.style.display = 'none';
        gradeFilter.value = 'all';
    }

    let filtered = allUsers;

    if (role !== 'all') {
        filtered = filtered.filter(u => u.role === role);
    }

    if (grade !== 'all' && role === 'Learner') {
        filtered = filtered.filter(u => u.grade_level === grade);
    }

    if (search) {
        filtered = filtered.filter(u =>
            u.full_name.toLowerCase().includes(search) ||
            u.email.toLowerCase().includes(search)
        );
    }

    renderUsers(filtered);
}

// ============================================
// ===== DELETE USER =====
// ============================================
function deleteUser(id, role) {
    if (!confirm(`Are you sure you want to delete this ${role}?`)) return;

    fetch('/users/' + id, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role: role })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        if (data.success) loadUsers();
    });
}

// ============================================
// ===== PAGE LOAD =====
// ============================================
document.addEventListener('DOMContentLoaded', function() {
    loadUsers();
});
</script>

</body>
</html>
