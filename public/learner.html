<!DOCTYPE html>
<html>

<head>
    <title>Learner Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
    <style>
        .student-info {
            color: #aaa;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .student-info .name {
            color: white;
            font-weight: bold;
            font-size: 18px;
        }

        .student-info .grade {
            color: #06d3f7;
        }

        .student-info .stream {
            color: #f39c12;
        }

        .subjects-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }

        .subject-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .subject-item:hover {
            background: rgba(6, 211, 247, 0.1);
            transform: translateX(5px);
            border-color: #06d3f7;
        }

        .subject-item .subject-name {
            color: white;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .subject-item .subject-name .icon {
            font-size: 24px;
        }

        .subject-item .arrow {
            color: #06d3f7;
            font-size: 20px;
        }

        .loading-subjects {
            text-align: center;
            padding: 30px;
            color: #aaa;
        }

        .no-subjects {
            text-align: center;
            padding: 30px;
            color: #f39c12;
        }

        .no-subjects .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 15px;
        }

        .logout-btn {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
        }

        .subject-emoji {
            font-size: 28px;
            margin-right: 12px;
        }
    </style>
</head>

<body class="student-bg">

    <h1 class="main-title">🎓 Learner Dashboard</h1>

    <div class="card dashboard-card">
        <h2>Welcome Learner</h2>

        <!-- Student Info -->
        <div class="student-info" id="studentInfo">
            <span class="name" id="studentName"></span>
            <span class="grade" id="studentGrade"></span>
            <span class="stream" id="studentStream"></span>
        </div>

        <!-- Subjects List -->
        <h3 style="color: #aaa; margin-bottom: 15px;">📚 Your Subjects</h3>
        <div id="subjectsContainer">
            <div class="loading-subjects">📊 Loading your subjects...</div>
        </div>

        <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem("loggedInUser"));

        if (!user || user.role !== "Learner") {
            window.location.href = "index.html";
        }

        // Display student info
        document.getElementById('studentName').textContent = user.full_name || 'Student';
        document.getElementById('studentGrade').textContent = user.grade_level ? `📚 ${user.grade_level}` : '';
        document.getElementById('studentStream').textContent = user.stream ? `• ${user.stream} Stream` : '';

        // ============================================
        // ===== LOAD SUBJECTS =====
        // ============================================
        async function loadSubjects() {
            const container = document.getElementById('subjectsContainer');
            container.innerHTML = '<div class="loading-subjects">📊 Loading your subjects...</div>';

            try {
                const response = await fetch("/student-subjects/" + encodeURIComponent(user.email));
                const data = await response.json();

                if (!data.success || data.subjects.length === 0) {
                    container.innerHTML = `
                <div class="no-subjects">
                    <span class="icon">📚</span>
                    <p>No subjects assigned yet.</p>
                    <p style="color: #666; font-size: 13px;">Please contact your teacher.</p>
                </div>
            `;
                    return;
                }

                // ✅ Updated emojis to match your database subjects
                const subjectEmojis = {
                    'Mathematics': '📐',
                    'Physical Sciences': '⚛️',
                    'Life Sciences': '🧬',
                    'English': '📖',
                    'Life Orientation': '📋',
                    'Accounting': '📊',
                    'Business Studies': '💼',
                    'Economics': '📈',
                    'History': '📜',
                    'Geography': '🌍',
                    'Natural Sciences': '🔬',
                    'Social Sciences': '🌍'
                };

                let html = '<div class="subjects-list">';
                data.subjects.forEach(subject => {
                    const emoji = subjectEmojis[subject] || '📚';
                    html += `
                <div class="subject-item" onclick="selectSubject('${subject}')">
                    <span class="subject-name">
                        <span class="subject-emoji">${emoji}</span>
                        ${subject}
                    </span>
                    <span class="arrow">➜</span>
                </div>
            `;
                });
                html += '</div>';
                container.innerHTML = html;

            } catch (error) {
                console.error("Error loading subjects:", error);
                container.innerHTML = '<p style="color: #e74c3c; text-align: center;">❌ Error loading subjects</p>';
            }
        }

        // ============================================
        // ===== SELECT SUBJECT =====
        // ============================================
        function selectSubject(subject) {
            localStorage.setItem('currentSubject', subject);
            window.location.href = 'subject-dashboard.html';
        }

        // ============================================
        // ===== LOGOUT =====
        // ============================================
        function logout() {
            localStorage.removeItem("loggedInUser");
            localStorage.removeItem("currentSubject");
            window.location.href = "index.html";
        }

        document.addEventListener("DOMContentLoaded", function () {
            loadSubjects();
        });
    </script>

</body>

</html>
