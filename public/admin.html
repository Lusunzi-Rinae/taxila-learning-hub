<!DOCTYPE html>
<html>
<head>
    <title>Administrator Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
</head>

<body class="admin-bg">

<h1 class="main-title">Administrator Dashboard</h1>

<div class="card dashboard-card">
    <h2>Welcome Admin</h2>

    <div class="carousel">
        <button class="carousel-arrow" onclick="scrollMenu(-1)">&#8249;</button>
        <div class="menu" id="menu">
        <button onclick="window.location.href='admin-attendance.html'">📅 Take Attendance</button>
       <button onclick="window.location.href='manage-contents.html'">Manage Contents</button>        
       <button onclick="window.location.href='monitor-activity.html'">📊 Monitor Activity</button>
        <button onclick="window.location.href='admin-announcement.html'">Announcements</button>
        <button onclick="window.location.href='manage-users.html'">Manage Users</button>
        <button onclick="window.location.href='manage-teachers.html'">👨‍🏫 Manage Teachers</button>
        <button onclick="window.location.href='manage-streams-subjects.html'">📚 Manage Streams & Subjects</button>
        <button onclick="window.location.href='manage-pending.html'">📝 Manage Pending Users</button>
        <button onclick="window.location.href='admin-promote.html'">🎓 End of Year Promotion</button>
        </div>
        <button class="carousel-arrow" onclick="scrollMenu(1)">&#8250;</button>
    </div>

    <button class="logout" onclick="logout()">Logout</button>
</div>

<script>
const user = JSON.parse(localStorage.getItem("loggedInUser"));

if (!user || user.role !== "admin") {
    window.location.href = "Login.html";
}

function logout() {
    localStorage.removeItem("loggedInUser");
    window.location.href = "index.html";
}



let carouselIndex = 0;

function renderCarousel() {
    const items = document.querySelectorAll("#menu button");
    items.forEach((btn, i) => {
        const offset = i - carouselIndex;
        const abs = Math.abs(offset);
        const scale = offset === 0 ? 1.15 : Math.max(0.6, 1 - abs * 0.22);
        btn.style.transform =
            `translate(-50%, -50%) translateX(${offset * 95}px) scale(${scale}) rotateY(${offset * -40}deg)`;
        btn.style.zIndex = 100 - abs;
        btn.style.opacity = abs > 2 ? "0" : `${1 - abs * 0.3}`;
        btn.style.pointerEvents = offset === 0 ? "auto" : "none"; // only the centered card is clickable
    });
}

function scrollMenu(direction) {
    const total = document.querySelectorAll("#menu button").length;
    carouselIndex = Math.min(Math.max(carouselIndex + direction, 0), total - 1);
    renderCarousel();
}

document.addEventListener("DOMContentLoaded", function () {
    const total = document.querySelectorAll("#menu button").length;
    carouselIndex = Math.floor((total - 1) / 2); // start with the middle card centered
    renderCarousel();

});

</script>

</body>
</html>
