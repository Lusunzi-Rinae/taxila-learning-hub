<!DOCTYPE html>
<html>
<head>
    <title>View Homework</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
</head>

<body class="student-bg">

<h1 class="main-title">Homework</h1>

<div class="card">
    <div id="filterInfo" style="color: #888; text-align: center; margin-bottom: 15px; font-size: 14px;"></div>
    <ul id="list"></ul>
    <button onclick="window.location.href='learner.html'">Back</button>
</div>

<script>
const list = document.getElementById("list");
const user = JSON.parse(localStorage.getItem("loggedInUser"));
const grade = user.grade_level || '';
const stream = user.stream || '';

fetch("/homework?grade=" + encodeURIComponent(grade) + "&stream=" + encodeURIComponent(stream))
    .then(res => res.json())
    .then(data => {
        if (data.length === 0) {
            list.innerHTML = "<li>No homework uploaded yet.</li>";
            return;
        }

        document.getElementById("filterInfo").innerHTML = `📚 Showing homework for <strong>${grade}</strong> ${stream ? '• <strong>' + stream + '</strong>' : ''}`;

        data.forEach(hw => {
            const li = document.createElement("li");
            li.innerHTML = `
                <b>${hw.title}</b><br>
                ${hw.description || ""}<br>
                <a href="${hw.file_path}" target="_blank">Open Document</a>
                <br>
                <small style="color: #888;">
                    📚 ${hw.grade_level || 'All Grades'} 
                    ${hw.stream ? '• ' + hw.stream : ''}
                    ${hw.subject && hw.subject !== 'All Subjects' ? '• 📋 ' + hw.subject : ''}
                </small>
                <br><br>
            `;
            list.appendChild(li);
        });
    });
</script>

</body>
</html>
