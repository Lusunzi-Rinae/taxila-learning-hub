<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1 class="main-title">Reset Password</h1>

<div class="card">
    <input id="email" type="email" placeholder="Enter your email">
    <button onclick="sendCode()">Send Verification Code</button>

    <input id="code" type="text" placeholder="Verification Code">
    <input id="newPassword" type="password" placeholder="New Password">
    <button onclick="resetPassword()">Reset Password</button>

    <button onclick="window.location.href='index.html'">Back to Login</button>
</div>

<script>
async function sendCode() {
    const email = document.getElementById("email").value;

    if (!email) {
        alert("Please enter your email");
        return;
    }

    try {
        const response = await fetch("/send-reset-code", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        });

        const data = await response.json();
        alert(data.message);
    } catch (error) {
        alert("Could not send code. Please try again.");
    }
}

async function resetPassword() {
    const email = document.getElementById("email").value;
    const code = document.getElementById("code").value;
    const newPassword = document.getElementById("newPassword").value;

    if (!email || !code || !newPassword) {
        alert("Please fill all fields");
        return;
    }

    if (newPassword.length < 6) {
        alert("Password must be at least 6 characters");
        return;
    }

    try {
        const response = await fetch("/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, code, newPassword })
        });

        const data = await response.json();
        alert(data.message);

        if (data.success) {
            window.location.href = "index.html";
        }
    } catch (error) {
        alert("Could not reset password. Please try again.");
    }
}
</script>

</body>
</html>
